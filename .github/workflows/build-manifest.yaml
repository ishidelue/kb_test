name: Build KB manifest

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'build_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:              # 連續兩次 push 不會互撞
  group: manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild notes.json
        run: python build_manifest.py

      - name: Commit if changed
        run: |
          git config user.name  "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add notes.json
          git diff --staged --quiet || git commit -m "chore: rebuild notes.json"
          git push